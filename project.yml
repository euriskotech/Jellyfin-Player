name: JellyfinPlayer
options:
  bundleIdPrefix: com.euriskotech
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID here, or pick it in Xcode
    CODE_SIGN_STYLE: Automatic

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    exactVersion: "3.3.1"   # 3.4.0 does not compile (JellyfinSocket.swift uses `any Error?`)

targets:
  # iPhone + iPad
  JellyfinPlayer:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: JellyfinAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.euriskotech.jellyfinplayer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Jellyfin Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Home servers are often plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Used to connect to your Jellyfin server on your home network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Apple TV
  JellyfinPlayerTV:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: JellyfinAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.euriskotech.jellyfinplayer
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Jellyfin Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Used to connect to your Jellyfin server on your home network.
